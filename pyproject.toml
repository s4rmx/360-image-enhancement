[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhance"
version = "0.1.0"
description = "360° equirectangular image auto-enhance research benchmark"
readme = "plan.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-contrib-python>=4.8,<5",
  "scikit-image>=0.22,<1",
  "pillow>=10,<12",
  "piexif>=1.1,<2",
  "pandas>=2.1,<3",
  "pyarrow>=14,<20",
  "pyyaml>=6,<7",
  "tqdm>=4.66,<5",
  "psutil>=5.9,<7",
  "torch>=2.1,<3",
  "pyiqa>=0.1.10,<1",
  "streamlit>=1.28,<2",
  "streamlit-image-comparison>=0.0.4,<1",
  "plotly>=5.18,<6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
enhance-run = "enhance.run:main"
enhance-benchmark = "enhance.benchmark:main"
enhance-report = "enhance.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
